[package]
name = "ism6hg256x-rs"
version = "2.1.0"
edition = "2024"
rust-version = "1.86.0"
readme = "README.md"
license = "BSD-3-Clause"
categories = ["embedded", "no-std"]
keywords = ["st", "mems", "imu", "mlc", "fsm"]
repository = "https://github.com/STMicroelectronics/ism6hg256x-rs"
description = """
    Driver for the ISM6HG256X IMU, featuring low-g (±16g) and high-g (±256g) accelerometers,
    a gyroscope, and quad-channel architecture for advanced acceleration and angular rate processing.
    Includes FSM/MLC modules for AI, IoT, and adaptive self-configuration, ideal for edge computing and shock detection.
"""

[lib]
doctest = false

[dependencies]
bisync2 = "0.3.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
bitfield-struct = "0.11.0"
half = { version = "2.6", default-features = false }
st-mems-bus = "2.0.0"
derive_more = { version = "2.0.1", default-features = false, features = ["try_from"] }
st-mem-bank-macro = "2.0.0"

# Features
# --------
# - By default the async API is enabled via the `async` feature.
#   Enable `blocking` to use the blocking variant instead.
#
# - Bit order defaults to Least Significant Bit first.
#   Enable `bit_order_msb` to use Most Significant Bit first.
[features]
default = ["async"]
# Expose the asynchronous driver module.
async = []
# Expose the blocking driver module.
blocking = []
# Use Most Significant Bit first instead of the default LSB-first ordering.
bit_order_msb = []

[package.metadata.docs.rs]
all-features = true
